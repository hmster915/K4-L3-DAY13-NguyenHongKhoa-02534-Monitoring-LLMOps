service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  rationale: Latency 3000ms is the user-facing upper bound in the dashboard contract. The 99.5% target permits a small number of cold-start or dependency failures while keeping the normal request path reliable.
  error_budget_example: With 10,000 requests in 28 days, the 0.5% error budget allows at most 50 requests to fail or exceed 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
